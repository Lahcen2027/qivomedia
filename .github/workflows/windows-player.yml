name: Windows player

on:
  push:
    branches: [main]
    paths: ["players/windows/**", ".github/workflows/windows-player.yml"]
  pull_request:
    paths: ["players/windows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installer (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: players/windows/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: players/windows/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: cargo test --locked
      - name: Check the kiosk script parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/../kiosk/setup-kiosk.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }
      - name: Build installers (NSIS .exe + MSI)
        run: npx --yes @tauri-apps/cli@2 build
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe out/
          Copy-Item target/release/bundle/msi/*.msi out/
          Copy-Item target/release/qivo-player.exe out/
          Copy-Item ../kiosk/setup-kiosk.ps1 out/
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: qivomedia-player-windows
          path: players/windows/src-tauri/out/
          if-no-files-found: error
