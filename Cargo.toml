[package]
name = "qivo-server"
version = "0.1.0"
edition = "2021"
description = "Qivomedia digital signage platform server"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "limit", "set-header"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
thiserror = "2"
anyhow = "1"
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "ring", "hostname"] }
totp-rs = { version = "5", features = ["otpauth", "gen_secret", "qr"] }
infer = "0.19"
sha1_smol = "1"
cookie = "0.18"
base64 = "0.22"
ring = "0.17"
jsonwebtoken = "11.1"

[profile.release]
lto = "thin"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
