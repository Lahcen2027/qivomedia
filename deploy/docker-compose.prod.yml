# Qivomedia production stack: app + Caddy (automatic HTTPS via Let's Encrypt).
# Usage (from the repository root):
#   cp deploy/.env.example deploy/.env   # then edit it
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: qivomedia

services:
  qivomedia:
    build:
      context: ..
      dockerfile: Dockerfile
    image: qivomedia:latest
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-qivo_server=info}
      QIVO_ALLOW_SIGNUP: ${QIVO_ALLOW_SIGNUP:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      QIVO_AI_MODEL: ${QIVO_AI_MODEL:-claude-sonnet-5-5}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Qivomedia <no-reply@qivomedia.com>}
      QIVO_NOTIFY_EMAIL: ${QIVO_NOTIFY_EMAIL:-}
      QIVO_PUBLIC_URL: ${QIVO_PUBLIC_URL:-}
      QIVO_SESSION_IDLE_HOURS: ${QIVO_SESSION_IDLE_HOURS:-12}
      QIVO_HIBP: ${QIVO_HIBP:-1}
      QIVO_SECURITY_CONTACT: ${QIVO_SECURITY_CONTACT:-}
    volumes:
      - qivo-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "qivo-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s
    # Least privilege: immutable filesystem (only /data and /tmp writable), no Linux capabilities.
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      qivomedia:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      QIVO_DOMAIN: ${QIVO_DOMAIN:?set QIVO_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ../site/dist:/srv/site:ro   # public website (SaaS mode only)
      - caddy-data:/data        # TLS certificates — keep this volume
      - caddy-config:/config
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  qivo-data:
  caddy-data:
  caddy-config:
