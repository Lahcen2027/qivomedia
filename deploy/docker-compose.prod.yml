# Qivomedia production stack: app + Caddy (automatic HTTPS via Let's Encrypt).
# Usage (from the repository root):
#   cp deploy/.env.example deploy/.env   # then edit it
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: qivomedia

services:
  qivomedia:
    build:
      context: ..
      dockerfile: Dockerfile
    image: qivomedia:latest
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-qivo_server=info}
      QIVO_ALLOW_SIGNUP: ${QIVO_ALLOW_SIGNUP:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      QIVO_AI_MODEL: ${QIVO_AI_MODEL:-claude-sonnet-5-5}
    volumes:
      - qivo-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "qivo-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      qivomedia:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      QIVO_DOMAIN: ${QIVO_DOMAIN:?set QIVO_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ../site/dist:/srv/site:ro   # public website (SaaS mode only)
      - caddy-data:/data        # TLS certificates — keep this volume
      - caddy-config:/config
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  qivo-data:
  caddy-data:
  caddy-config:
